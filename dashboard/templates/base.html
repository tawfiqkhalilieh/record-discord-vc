<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VC Stash{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><a class="brand" href="/">◉ VC Stash</a><span>Live calls & recordings</span>
    {% if request.session.get('admin') %}
    <form method="post" action="/logout"><input type="hidden" name="token" value="{{ request.session.csrf }}"><button class="secondary">Sign out</button></form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
